[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
# Consider changing the name to something specific to your research
name = "pes-nn-fit-2026" 
version = "0.1.0"
description = "Neural network fitting for potential energy surfaces of small molecules"
dependencies = [
    "numpy==1.23.5",
    "optuna==4.7.0",
    "pandas==2.1.4",
    "PyYAML==6.0.3",
    "scikit-learn==1.3.2",
    "scipy==1.13.0",
    "torch==2.0.1",
    "torch-levenberg-marquardt==1.2.3",
    "setuptools<70.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
